server:
  servlet:
    context-path: '/api/better-marketplace'

logging:
  level:
    jdbi:
      sql: DEBUG

spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # "dev" also loads the sample users and items; set LIQUIBASE_CONTEXTS=prod in production
    contexts: ${LIQUIBASE_CONTEXTS:dev}
  application:
    name: better-marketplace
  datasource:
    driver-class-name: org.postgresql.Driver
    username: marketplace-user
    password: ${DB_PASSWORD:changemelater}
    url: jdbc:postgresql://localhost:5432/marketplace
  openfeign:
    client:
      config:
        default:
          connectTimeout: 5000
          readTimeout: 10000
          loggerLevel: basic
app:
  security:
    token:
      expiration-hours: 168



clients:
  open-data-client:
    url: 'https://data.opendatasoft.com/api/explore/v2.1/catalog/datasets/geonames-postal-code@public/exports'

file-service:

