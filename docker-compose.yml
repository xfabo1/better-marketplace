services:
  better-marketplace-db:
    container_name: better-marketplace-db
    image: postgis/postgis
    environment:
    - POSTGRES_PASSWORD=changemelater
    - POSTGRES_USER=marketplace-user
    - POSTGRES_DB=marketplace
    volumes:
    - marketplace-data:/var/lib/postgresql/data
    ports:
    - "5432:5432"
  marketplace-app:
    profiles:
      - 'start-app'
    container_name: better-marketplace
    environment:
    - SPRING_DATASOURCE_URL=jdbc:postgresql://better-marketplace-db:5432/marketplace
    - SPRING_DATASOURCE_USERNAME=marketplace-user
    - SPRING_DATASOURCE_PASSWORD=changemelater
    - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
    build:
      context: .
      dockerfile: ./Dockerfile
    depends_on:
    - better-marketplace-db
    ports:
    - "8080:8080"
  marketplace-keycloak:
    container_name: marketplace-keycloak
    image: keycloak/keycloak:26.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: changemelater
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: true
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: true
      KC_METRICS_ENABLED: true
    command:
      ["start-dev"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"
volumes:
  marketplace-data: { }
